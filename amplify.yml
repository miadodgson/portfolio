version: 1
frontend:
  phases:
    build:
      commands:
        - npm install
        - npm run build
  artifacts:
    baseDirectory: build  # This should point to the 'build' folder after running `build`
    files:
      - '**/*'  # Include all files from the 'build' folder
  cache:
    paths:
      - node_modules/**/*

