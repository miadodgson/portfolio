version: 1
frontend:
  phases:
    preBuild:
      commands:
        - yarn install
    build:
      commands:
        - yarn build
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*


  customHeaders:
    - pattern: "**/*.glb"
      headers:
        - key: "Content-Type"
          value: "model/gltf-binary"


